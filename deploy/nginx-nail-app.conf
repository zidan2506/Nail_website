# /etc/nginx/sites-available/nail-app
# Chỉ có block :80. Sau khi chạy `certbot --nginx`, certbot tự thêm block :443
# (HTTPS) và redirect 80 -> 443.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;   # <-- SỬA domain thật

    client_max_body_size 10M;   # cho upload ảnh (avatar/service/gallery)

    # nginx phục vụ static trực tiếp, không qua gunicorn (nhanh hơn)
    location /static/ {
        alias /var/www/nail-app/app/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # để Flask biết là HTTPS
    }
}
