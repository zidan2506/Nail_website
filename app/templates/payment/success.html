{% extends "base.html" %}

{% block title %}Payment Successful | DahaCare{% endblock %}

{% block extra_css %}
<style>
  .pay-wrap {
    min-height: calc(100vh - 72px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .pay-card {
    text-align: center;
    max-width: 460px;
    width: 100%;
    background: #ffffff;
    border-radius: 26px;
    padding: 3rem 2.5rem;
    box-shadow: 0 10px 25px rgba(35, 22, 28, 0.06);
  }
  .pay-icon {
    font-size: 56px;
    display: block;
    margin-bottom: 1.25rem;
    color: #2e9e6b;
  }
  .pay-icon--cancel { color: #d64682; }
  .pay-heading {
    font-size: 1.8rem;
    font-weight: 700;
    color: #24161c;
    margin: 0 0 0.75rem;
  }
  .pay-body {
    font-size: 1rem;
    color: #73636a;
    line-height: 1.7;
    margin: 0 0 1.25rem;
  }
  .pay-countdown {
    font-size: 0.85rem;
    font-weight: 600;
    color: #a08890;
    margin: 0 0 1.75rem;
  }
  .pay-actions { display: flex; flex-direction: column; gap: 0.75rem; }
  .pay-btn {
    display: inline-block;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    border-radius: 14px;
    padding: 13px 26px;
    text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .pay-btn--primary { color: #ffffff; background: #d64682; }
  .pay-btn--primary:hover { background: #b83a6e; }
  .pay-btn--ghost { color: #d64682; border: 1px solid rgba(214, 70, 130, 0.40); }
  .pay-btn--ghost:hover { background: #d64682; color: #ffffff; }
</style>
{% endblock %}

{% block content %}
<div class="pay-wrap">
  <div class="pay-card">
    <span class="material-symbols-outlined pay-icon">check_circle</span>
    <h1 class="pay-heading">Payment Successful!</h1>
    <p class="pay-body">
      Thank you — your payment went through. You're all set.
    </p>
    <p class="pay-countdown">
      Redirecting in <span id="pay-count">5</span>s…
    </p>
    <div class="pay-actions">
      <a href="{{ next_url }}" class="pay-btn pay-btn--primary">{{ next_label }}</a>
      <a href="{{ url_for('main.home') }}" id="pay-home" class="pay-btn pay-btn--ghost">Back to Home</a>
    </div>
  </div>
</div>

<script>
  (function () {
    var target = "{{ next_url }}";
    var seconds = 5;
    var countEl = document.getElementById('pay-count');
    var tick = setInterval(function () {
      seconds -= 1;
      if (countEl) countEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(tick);
        window.location.href = target;
      }
    }, 1000);
    // "Back to Home" hủy auto-redirect để không bị giật sang /success.
    document.getElementById('pay-home').addEventListener('click', function () {
      clearInterval(tick);
    });
  })();
</script>
{% endblock %}
